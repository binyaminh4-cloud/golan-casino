<!doctype html>
<html lang="he" dir="rtl">
<head>
 <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
 <title>מילואימניק · גולן קזינו</title>
 <link rel="icon" href="img/brand/favicon.png?v=2"><link rel="stylesheet" href="reservist.css?v=1794218732">
 <script src="loader.js?v=14"></script><script src="errlog.js?v=1794585005"></script><script src="portrait.js?v=2"></script>
 <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script><script src="config.js?v=8"></script>
</head>
<body>
 <header><a href="jobs.html">→ עבודות</a><h1>מילואימניק</h1><button id="sound" aria-label="הגדרות צליל">🔊</button></header>
 <main>
  <section id="select"><p>ארבע משימות · השכר נכנס לבנק</p><div id="choices"></div><p id="note" role="status"></p></section>
  <section id="play" hidden>
   <div class="hud"><strong id="mission"></strong><b id="clock" aria-label="זמן שנותר"></b><span id="score"></span></div>
   <div id="dossier" hidden></div>
   <p class="hint" id="hint"></p>
   <div class="view"><canvas id="scene" width="640" height="760" aria-label="זירת המשימה"></canvas><span id="feedback" role="status"></span></div>
   <div class="controls"><button id="scope" hidden><img src="img/reservist/button_scope.webp" alt="">כוונת</button><button id="fire"><img src="img/reservist/button_fire.webp" alt="">ירי</button><button id="rules">כללים</button><button id="finish">סיום משימה</button></div>
  </section>
 </main>
 <dialog id="help"><h2>המשימה</h2><p id="helpText"></p><p>הזמן ממשיך לרוץ בזמן הצגת הכללים.</p><button id="closeHelp">חזרה למשימה</button></dialog>
 <dialog id="result"><h2>סיכום משימה</h2><p id="resultText"></p><button id="again">לבחירת משימה</button><a href="jobs.html">חזרה לעבודות</a><a href="./">ללובי</a></dialog>
 <script src="sfx.js?v=1794046058"></script><script src="char.js?v=3"></script><script src="guide.js?v=1794419520"></script>
 <script type="module" src="reservist.mjs?v=1794295413"></script>
</body>
</html>
