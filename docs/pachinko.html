<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<script src="loader.js?v=10"></script>
<title>מכונת השירותים · גולן קזינו</title>
<link rel="icon" href="img/brand/favicon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;700;800&family=Inter:wght@700;800&display=swap">
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{position:fixed;inset:0;background:#0d1b18;color:#f4e3be;font:15px Heebo,Arial,sans-serif;display:flex;flex-direction:column;overflow:hidden}
.top{display:flex;gap:10px;align-items:center;padding:5px max(10px,env(safe-area-inset-right)) 5px max(56px,calc(52px + env(safe-area-inset-left)));background:#081310e6;border-bottom:1px solid #8d7145}
.top a{color:#ffe2a2;text-decoration:none;font-weight:700;border:1px solid #a78a53;border-radius:99px;padding:5px 12px;white-space:nowrap}
.bal{white-space:nowrap;color:#b9bdad}.bal b{color:#ffe2a2;font:800 16px Inter}
.ctl{display:flex;gap:6px;align-items:center}
.bottom{display:flex;gap:10px;align-items:center;justify-content:center;padding:6px max(10px,env(safe-area-inset-right)) max(6px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left));background:#081310e6;border-top:1px solid #8d7145}
#spin{min-width:130px;height:48px;font-size:20px!important;border-radius:99px!important}
#err{margin-inline-start:auto}
button{border:1px solid #a78a53;background:#203c32;color:#ffe2a2;padding:7px 12px;border-radius:8px;font:700 14px Heebo;cursor:pointer}
button[aria-pressed="true"]{background:#a78a53;color:#0d1b18}#spin{background:linear-gradient(180deg,#ffe2a2,#a78a53);color:#0d1b18;min-width:90px;font-size:16px}
button:disabled{opacity:.5}
.wrap{flex:1;min-height:0;display:grid;place-items:center;overflow:hidden}canvas{display:block;border-radius:10px}
#err{color:#E89A9F;font-size:12px}

/* full-screen machine: the game takes the whole height, controls live in the side margins */
body{display:block!important}
.top{position:fixed;top:0;bottom:0;left:0;z-index:3;width:max(86px,calc(78px + env(safe-area-inset-left)));flex-direction:column;justify-content:flex-start;gap:8px;padding:8px 6px 8px max(6px,env(safe-area-inset-left))!important;background:linear-gradient(90deg,#081310f0,#08131000);border:0!important}
.top a{padding:4px 8px!important;font-size:12px}.top .bal{display:grid;text-align:center;font-size:10px;gap:1px}.top .bal b{font-size:13px!important}
#err{position:fixed;top:6px;left:50%;transform:translateX(-50%);z-index:4;background:#081310e6;border-radius:99px;padding:0 10px}
.wrap{position:fixed;inset:0;display:grid;place-items:center}
.bottom{position:fixed;top:0;bottom:0;right:0;z-index:3;width:max(96px,calc(88px + env(safe-area-inset-right)));flex-direction:column;justify-content:center;gap:10px;padding:8px max(6px,env(safe-area-inset-right)) 8px 6px!important;background:linear-gradient(270deg,#081310f0,#08131000);border:0!important}
#bets{display:grid;justify-items:center;gap:3px}#bets button{width:44px;height:30px;padding:0;font-size:14px}#bets b{font:800 14px Inter;color:#ffe2a2}#bets small{font-size:10px;color:#b9bdad;margin-top:-3px}
#spin{min-width:0!important;width:80px;height:80px;border-radius:50%!important;font-size:18px!important}
#buy{padding:5px 6px;font-size:12px}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js?v=8"></script>
<script src="landscape.js?v=1"></script>
</head>
<body>
<header class="top"><a href="./">→ ללובי</a><span class="bal">הארנק שלי <b id="bal">…</b></span><span id="err"></span></header>
<div class="wrap"><canvas id="game" width="1600" height="900" aria-label="מכונת השירותים והפצ׳ינקו"></canvas></div>
<footer class="bottom"><div class="ctl" id="bets"></div><button id="buy" title="קניית בונוס">🛒 בונוס</button><button id="spin">סובב</button></footer>
<script src="sfx.js?v=16"></script>
<script type="module">
import { scoreDrops } from "./vendor/pc_rules.mjs?v=1";
import { Renderer, prepareArt } from "./vendor/pc_renderer.mjs?v=4";
// Golan Casino wiring: every spin and bonus is decided on the server (pc_spin); the kit's renderer only plays it back.
const db = supabase.createClient(GC_CONFIG.supabaseUrl, GC_CONFIG.supabaseKey);
try { if (localStorage.getItem("gc_dev") !== "1" && localStorage.getItem("gc_open") !== "1") location.href = "./"; } catch (e) {}
const $ = (id) => document.getElementById(id);
const fmt = (n) => { n = Number(n); const a = Math.abs(n); return a >= 1e9 ? "₪" + +(n / 1e9).toFixed(2) + "B" : a >= 1e6 ? "₪" + +(n / 1e6).toFixed(2) + "M" : "₪" + n.toLocaleString("en-US"); };
const clock = () => performance.now() / 1000;
const BETS = [10, 50, 100, 500, 1000, 5000, 25000];
let bet = 100, balance = 0, busy = false, state = null, renderer = null, after = null;
// bet: one small ▲ value ▼ control instead of a row of buttons
function drawBets() { const ok = GC_LADDER(10, balance); if (!ok.includes(bet)) bet = ok[0];
  $("bets").innerHTML = `<button data-d="1" ${ok.indexOf(bet) >= ok.length - 1 ? "disabled" : ""}>▲</button><b>${fmt(bet)}</b><small>הימור</small><button data-d="-1" ${ok.indexOf(bet) <= 0 ? "disabled" : ""}>▼</button>`; $("bets").dataset.ok = ok.join(","); }
$("bets").onclick = (e) => { const b = e.target.closest("button"); if (!b || busy) return; const ok = $("bets").dataset.ok.split(",").map(Number), i = ok.indexOf(bet) + +b.dataset.d;
  if (i < 0 || i >= ok.length) return; bet = ok[i]; drawBets(); try { SFX.chip(); } catch (er) {} if (state && state.mode === "slot") state.betLabel = "הימור " + fmt(bet); };
function showBal(v) { balance = +v; $("bal").textContent = fmt(v); drawBets(); }
const badgesOf = (b) => Object.fromEntries(Object.entries(b || {}).map(([k, v]) => [+k, v]));
$("spin").onclick = async () => {
  if (busy) return; busy = true; $("spin").disabled = true; $("err").textContent = "";
  state = { ...state, mode: "slot", spinning: true, spinEnd: clock() + 99, msg: "בהצלחה…" };
  const { data, error } = await db.rpc("pc_spin", { p_stake: bet, p_ref: crypto.randomUUID ? crypto.randomUUID() : Date.now() + "" + Math.random() });
  if (error) { const m = error.message || ""; $("err").textContent = m.includes("insufficient") ? "אין מספיק שקלים." : m.includes("invalid_amount") ? "הסכום מעל המקסימום שלך." : "משהו השתבש.";
    state.spinning = false; busy = false; $("spin").disabled = false; return; }
  playResult(data);
};
function playResult(data) {
  showBal(data.balance - data.payout);
  setTimeout(() => {
    const lineWin = Math.floor(data.stake * data.line_mult / 10);
    state = { mode: "slot", grid: data.grid, badges: badgesOf(data.badges), spinning: false, betLabel: "הימור " + fmt(data.stake),
      msg: data.bonus ? (data.bonus.kind === "super" ? "סופר בונוס!" : "בונוס!") : lineWin ? "זכית " + fmt(lineWin) : "לא הפעם" };
    try { lineWin ? SFX.win(false) : data.bonus ? SFX.win(true) : SFX.lose(); } catch (e) {}
    if (!data.bonus) { showBal(data.balance); busy = false; $("spin").disabled = false; return; }
    const b = data.bonus, out = scoreDrops(b.kind, b.entry, b.targets);
    const dur = b.kind === "super" ? 1.4 + 19 * .9 + 6.2 : 1.4 + (b.targets.length - 1) * 10 + 9;
    setTimeout(async () => {
      await GC_BONUS_INTRO(b.kind === "super" ? "💩 סופר בונוס של פישר!" : "🚽 הבונוס של אביחי!", b.kind === "super"
        ? ["פישר יושב על האסלה ומשחרר 20 גושים קטנים.", "כל גוש קופץ בין הפינים ונוחת אצל אחד החברים. כל נחיתה מוסיפה את הערך שלו.", `מכפיל הכניסה שלך: ×${b.entry}. הכל משולם ביחס להימור.`]
        : ["אביחי נוסע על המסילה ומשחרר גוש אחד.", "הגוש קופץ מפין לפין ונוחת באחד התאים: ×5 עד ×100.", "נחיתה ב״דאבל״ מכפילה את כל הערכים ומקבלים עוד נפילה.", `מכפיל הכניסה שלך: ×${b.entry}.`], "img/pc/avichai.webp");
      state = { mode: b.kind, outcome: out, startedAt: clock() };
      setTimeout(() => {
        showBal(data.balance);
        if (window.GC_BONUS) GC_BONUS(b.kind === "super" ? `💩 סופר בונוס ×${out.total}` : `🚽 בונוס ×${out.total}`, data.payout, b.entry > 1 ? `מכפיל כניסה ×${b.entry}` : "");
        state = { mode: "slot", grid: data.grid, badges: badgesOf(data.badges), spinning: false, betLabel: "הימור " + fmt(data.stake), msg: "זכית " + fmt(data.payout) };
        busy = false; $("spin").disabled = false;
      }, (dur + 1.2) * 1000);
    }, 1800);
  }, 1300);
}
// bonus buy: Avichai's pachinko or Fisher's super, straight away
$("buy").onclick = async () => {
  if (busy) return; const P = await (await db.rpc("gc_buy_prices")).data || {};
  const kind = await GC_BUYMENU([{ kind: "regular", label: "הבונוס של אביחי", price: P["pachinko:regular"] || 17, desc: "פצ׳ינקו עם דאבל, מכפיל כניסה ×1" },
    { kind: "super", label: "הסופר בונוס של פישר", price: P["pachinko:super"] || 133, desc: "20 נפילות על שבעת החברים" }], bet, fmt);
  if (!kind) return; busy = true; $("spin").disabled = true; $("err").textContent = "";
  const { data, error } = await db.rpc("pc_buy", { p_kind: kind, p_stake: bet, p_ref: crypto.randomUUID ? crypto.randomUUID() : Date.now() + "" + Math.random() });
  if (error) { const m = error.message || ""; $("err").textContent = m.includes("insufficient") ? "אין מספיק שקלים." : "הקנייה נכשלה."; busy = false; $("spin").disabled = false; return; }
  data.grid = state.grid; playResult(data);
};
const load = (src) => new Promise((ok, no) => { const im = new Image(); im.onload = () => ok(im); im.onerror = () => no(new Error(src)); im.src = src; });
(async () => {
  const ids = ["friend_01", "friend_02", "friend_03", "fisher", "friend_05", "friend_06", "yoav", "avichai"], images = {};
  await Promise.all([["background", "background"], ["symbols", "symbols"], ["bodies", "bodies"], ...ids.map((i) => [i, i])].map(async ([k, f]) => images[k] = await load(`img/pc/${f}.webp`)));
  const manifest = { originals: ids, faceCropBottom: { friend_01: .419, friend_02: .407, friend_03: .405, fisher: .405, friend_05: .395, friend_06: .413, yoav: .455, avichai: .412 },
    bodyAtlas: { neckAnchors: [[0.6, 0.06], [0.6, 0.07], [0.44, 0.07], [0.5, 0.07], [0.54, 0.23], [0.5, 0.32], [0.5, 0.17], [0.51, 0.07]] } };
  const art = prepareArt(images, manifest, (w, h) => { const c = document.createElement("canvas"); c.width = w; c.height = h; return c; });
  renderer = new Renderer($("game"), art);
  state = { mode: "slot", grid: [0, 1, 2, 3, 4, 6, 5, 2, 4, 1, 3, 2, 0, 5, 1], badges: {}, spinning: false, betLabel: "הימור " + fmt(bet), msg: "לחץ סובב" };
  const fit = () => { const w = $("game").parentElement, s = Math.min((w.clientWidth - 2 * 70) / 1600, w.clientHeight / 900); $("game").style.width = 1600 * s + "px"; $("game").style.height = 900 * s + "px"; };
  addEventListener("resize", fit); fit(); setTimeout(fit, 400); try { new ResizeObserver(fit).observe($("game").parentElement); } catch (e) {}
  const frame = () => { renderer.frame(state, clock()); requestAnimationFrame(frame); }; requestAnimationFrame(frame);
  const { data: { session } } = await db.auth.getSession(); if (!session) { location.href = "./"; return; }
  const w = await db.from("wallets").select("balance").eq("user_id", session.user.id).single(); if (w.data) showBal(w.data.balance);
  if (window.GC_LOADER) GC_LOADER.done();
})().catch((e) => { $("err").textContent = "טעינה נכשלה"; console.error(e); });
</script>
<script src="chat.js?v=13"></script>
</body>
</html>
