<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<script src="loader.js?v=13"></script>
<title>הבנק · גולן קזינו</title>
<link rel="icon" href="img/brand/favicon.png?v=2">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@500;700;800&family=Frank+Ruhl+Libre:wght@700&family=Inter:wght@700;800&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js?v=8"></script>
<script src="portrait.js?v=1"></script>
<style>
  [hidden]{display:none!important}
  html,body{margin:0;min-height:100%;background:#0B0908;color:#F5ECDD;font:500 15px/1.5 Heebo,sans-serif}
  .hall{position:fixed;inset:0;background:radial-gradient(ellipse at 50% 30%,#3a2c18,#0B0908 70%);background-size:cover;background-position:center top}
  .hall.img{background-image:linear-gradient(rgba(11,9,8,.05),rgba(11,9,8,.35) 60%,rgba(11,9,8,.9)),url(img/bank/bank_hall.webp?v=1)}
  .top{position:relative;z-index:2;display:flex;align-items:center;justify-content:space-between;padding:max(10px,env(safe-area-inset-top)) 12px 8px}
  .top a{color:#F1D69A;text-decoration:none;border:1px solid rgba(241,214,154,.5);border-radius:99px;padding:5px 12px;font:700 14px Heebo;background:rgba(11,9,8,.55)}
  .top h1{margin:0;font:700 24px 'Frank Ruhl Libre',serif;color:#F1D69A;text-shadow:0 2px 8px #000}
  .desk{position:fixed;left:50%;bottom:max(14px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:2;width:min(440px,92vw);
    background:linear-gradient(180deg,rgba(40,26,14,.94),rgba(20,13,8,.96));border:2px solid #C5A05A;border-radius:18px;padding:14px;box-shadow:0 16px 40px rgba(0,0,0,.7)}
  .bals{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
  .bals div{background:rgba(255,255,255,.05);border-radius:12px;padding:8px 10px;text-align:center}
  .bals small{display:block;color:#cdbb98;font-size:12px}.bals b{font:800 20px Inter;color:#ffe27a;direction:ltr;unicode-bidi:isolate}
  .bals .bank b{font-size:24px}
  .amt{display:flex;gap:6px;align-items:center}
  .amt input{flex:1;min-width:0;font:800 20px Inter;direction:ltr;text-align:center;padding:10px;border-radius:12px;border:1px solid #C5A05A;background:#120c08;color:#F5ECDD}
  .q{display:flex;gap:6px;margin:8px 0}.q button{flex:1;padding:7px 0;border-radius:10px;border:1px solid rgba(241,214,154,.4);background:transparent;color:#F1D69A;font:700 13px Heebo;cursor:pointer}
  .act{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .act button{padding:12px;border:0;border-radius:12px;font:800 17px Heebo;cursor:pointer}
  .dep{background:linear-gradient(#F1D69A,#C5A05A);color:#1b0f06}.wd{background:#1f3a2a;color:#d9f5e3;border:1px solid #3ad16f!important}
  .act button:disabled{opacity:.5}
  .msg{min-height:20px;text-align:center;font-size:13px;color:#ffb3b3;margin-top:6px}.msg.ok{color:#9ff0bf}
  details{margin-top:6px}summary{cursor:pointer;color:#cdbb98;font-size:13px;text-align:center}
  .tx{max-height:24dvh;overflow:auto;margin-top:6px}.tx div{display:flex;justify-content:space-between;font-size:13px;padding:4px 2px;border-bottom:1px solid rgba(255,255,255,.06)}
  .tx b{font:700 13px Inter;direction:ltr}.tx .p{color:#9ff0bf}.tx .m{color:#ffb3b3}
</style>
</head>
<body>
<div class="hall" id="hall"></div>
<header class="top"><a href="./">→ ללובי</a><h1>🏦 הבנק</h1><span style="width:70px"></span></header>
<section class="desk">
  <div class="bals"><div class="bank"><small>בבנק</small><b id="bBank">…</b></div><div><small>בארנק (למשחקים)</small><b id="bWallet">…</b></div></div>
  <div class="amt"><input id="amt" inputmode="numeric" placeholder="סכום" autocomplete="off"></div>
  <div class="q"><button data-q="1000000">1M</button><button data-q="10000000">10M</button><button data-q="half">חצי</button><button data-q="all">הכול</button></div>
  <div class="act"><button class="dep" id="depBtn">⬇ הפקדה לבנק</button><button class="wd" id="wdBtn">⬆ משיכה לארנק</button></div>
  <div class="msg" id="msg"></div>
  <details><summary>תנועות אחרונות</summary><div class="tx" id="tx"></div></details>
</section>
<script src="sfx.js?v=27"></script>
<script>
const $ = (id) => document.getElementById(id);
const fmt = (n) => { n = Number(n) || 0; const a = Math.abs(n); return a >= 1e9 ? "₪" + +(n / 1e9).toFixed(2) + "B" : a >= 1e6 ? "₪" + +(n / 1e6).toFixed(2) + "M" : "₪" + n.toLocaleString("en-US"); };
const PREVIEW = /[?#&]preview/.test(location.href);
const db = PREVIEW ? null : supabase.createClient(GC_CONFIG.supabaseUrl, GC_CONFIG.supabaseKey);
const KIND = { salary_weekly: "משכורת שבועית", salary_monthly: "משכורת חודשית", gift: "מתנה מבעל הבית", deposit: "הפקדה", withdraw: "משיכה" };
let S = { bank: 0, wallet: 0, tx: [] }, lastQ = null;
const img = new Image(); img.onload = () => $("hall").classList.add("img"); img.src = "img/bank/bank_hall.webp?v=1";
function draw() {
  $("bBank").textContent = fmt(S.bank); $("bWallet").textContent = fmt(S.wallet);
  $("tx").innerHTML = S.tx.length ? S.tx.map((t) => `<div><span>${KIND[t.kind] || t.kind} · ${new Date(t.at).toLocaleDateString("he-IL", { day: "numeric", month: "numeric" })}</span><b class="${t.amount > 0 ? "p" : "m"}">${t.amount > 0 ? "+" : ""}${fmt(t.amount)}</b></div>`).join("") : "<div><span>אין עדיין תנועות</span></div>";
}
const amount = () => Math.floor(Number(String($("amt").value).replace(/[^\d]/g, "")) || 0);
$("amt").oninput = () => { const v = amount(); $("amt").value = v ? v.toLocaleString("en-US") : ""; lastQ = null; };
document.querySelector(".q").onclick = (e) => { const b = e.target.closest("button"); if (!b) return; lastQ = b.dataset.q;
  const v = lastQ === "all" || lastQ === "half" ? null : +lastQ; $("amt").value = v ? v.toLocaleString("en-US") : ""; if (!v) $("amt").placeholder = lastQ === "all" ? "הכול" : "חצי"; };
async function move(dir) {
  let v = amount(); const src = dir === "deposit" ? S.wallet : S.bank;
  if (!v && lastQ === "all") v = src; if (!v && lastQ === "half") v = Math.floor(src / 2);
  const m = $("msg"); m.className = "msg";
  if (!v) return m.textContent = "כתוב סכום או בחר הכול / חצי.";
  if (v > src) return m.textContent = dir === "deposit" ? `יש בארנק רק ${fmt(S.wallet)}.` : `יש בבנק רק ${fmt(S.bank)}.`;
  $("depBtn").disabled = $("wdBtn").disabled = true;
  if (PREVIEW) { if (dir === "deposit") { S.wallet -= v; S.bank += v; } else { S.bank -= v; S.wallet += v; } }
  else { const { data, error } = await db.rpc("bank_move", { p_amount: v, p_dir: dir, p_ref: crypto.randomUUID ? crypto.randomUUID() : Date.now() + "" + Math.random() });
    if (error) { $("depBtn").disabled = $("wdBtn").disabled = false; return m.textContent = "הפעולה לא עברה. נסה שוב."; } S = data; }
  $("depBtn").disabled = $("wdBtn").disabled = false; $("amt").value = ""; $("amt").placeholder = "סכום"; lastQ = null;
  m.className = "msg ok"; m.textContent = dir === "deposit" ? `הופקדו ${fmt(v)} לבנק ✔` : `נמשכו ${fmt(v)} לארנק ✔`; try { SFX.coins(0.8); } catch (e) {} draw();
}
$("depBtn").onclick = () => move("deposit"); $("wdBtn").onclick = () => move("withdraw");
(async () => {
  if (PREVIEW) { S = { bank: 120000000, wallet: 5400000, tx: [{ kind: "salary_weekly", amount: 10000000, at: new Date() }] }; draw(); GC_LOADER.done(); return; }
  const { data: { session } } = await db.auth.getSession(); if (!session) { location.href = "./"; return; }
  try { await db.rpc("salary_claim"); } catch (e) {}
  const { data } = await db.rpc("bank_state"); if (data) S = data; draw(); GC_LOADER.done();
})();
</script>
<script src="chat.js?v=15"></script>
</body>
</html>
