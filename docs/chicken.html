<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<script src="loader.js?v=13"></script>
<title>עידו חוצה את הכביש · גולן קזינו</title>
<link rel="icon" href="img/brand/favicon.png?v=2">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;700;900&family=Inter:wght@700;800;900&display=swap">
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden}
body{position:fixed;inset:0;background:#141210 url(img/ck/road.webp) center/cover;color:#f3f2e9;font:15px Heebo,Arial,sans-serif}
body::before{content:"";position:fixed;inset:0;backdrop-filter:blur(12px) brightness(.5);-webkit-backdrop-filter:blur(12px) brightness(.5)}
/* the road is one 1672×941 stage (the approved art), scaled to fill the screen without cropping */
#stage{position:absolute;left:50%;top:50%;width:1672px;height:941px;transform-origin:50% 50%;background:url(img/ck/road.webp) 0 0/100% 100%;overflow:hidden}
.abs{position:absolute}
.mk{width:176px;height:122px;margin:-61px 0 0 -88px;top:560px;border-radius:50%;display:grid;place-content:center;text-align:center;
  background:radial-gradient(circle,#2b3a4c 0,#1a2533 70%);border:5px solid #5f8db8;box-shadow:0 0 18px #3f86d888,inset 0 0 14px #0009;transition:left .35s ease,opacity .3s}
.mk b{font:900 40px Inter;color:#ffd970;text-shadow:0 2px 0 #6b4a00;line-height:1}.mk small{font:800 19px Inter;color:#c9d9ea;margin-top:2px}
.mk.cur{border-color:#8af6c3;box-shadow:0 0 22px #45e2a7aa,inset 0 0 12px #0008}.mk.done{opacity:.45}
#ido{width:250px;height:240px;margin:-200px 0 0 -125px;top:600px;object-fit:contain;z-index:5;filter:drop-shadow(0 10px 8px #0009);transition:left .42s cubic-bezier(.3,.7,.4,1)}
#ido.hop{animation:hop .42s ease-out}@keyframes hop{50%{transform:translateY(-90px) rotate(-6deg)}}
#ido.hit{animation:hit .7s ease-out}@keyframes hit{20%{transform:translate(18px,-30px) rotate(25deg)}60%{transform:translate(-10px,10px) rotate(-12deg) scale(.9)}}
#car{width:300px;height:420px;margin-left:-150px;top:-420px;object-fit:contain;z-index:6;filter:drop-shadow(0 12px 8px #0008);pointer-events:none}
#who{top:40px;margin-left:-110px;width:220px;text-align:center;z-index:9;background:rgba(14,16,22,.9);border:3px solid #ffd970;border-radius:99px;padding:6px 0;font:900 34px Heebo;color:#ffe9a8;animation:wp .3s ease-out}#who[hidden]{display:none}@keyframes wp{from{transform:scale(.5)}}
.feather{position:absolute;z-index:7;font-size:40px;pointer-events:none;animation:fe 1.1s ease-out forwards}@keyframes fe{to{transform:translate(var(--dx),var(--dy)) rotate(260deg);opacity:0}}
/* bottom bar, like the approved screen */
#bar{left:40px;top:770px;width:1592px;height:150px;border-radius:30px;background:rgba(18,20,26,.88);border:2px solid #3a3f4a;box-shadow:0 12px 30px #000a;display:flex;align-items:center;gap:18px;padding:0 20px;direction:ltr}
.grp{height:110px;border-radius:22px;background:#0d0f14;border:2px solid #2c313b;display:flex;align-items:center;gap:12px;padding:0 14px}
.sq{width:96px;height:84px;border-radius:16px;border:2px solid #3b414d;background:linear-gradient(#2a2f39,#1b1f27);color:#fff;font:900 48px Inter;cursor:pointer;display:grid;place-items:center}
.sq:disabled{opacity:.35}
#betV{min-width:180px;text-align:center;font:900 46px Inter;color:#ffd970;direction:ltr}#betV small{display:block;font:700 18px Heebo;color:#9aa6b6}
.lv{display:flex;gap:10px;align-items:center}.lv span{font-size:36px;margin:0 2px}
.lv button{width:96px;height:68px;border-radius:14px;border:2px solid #3b414d;background:#2a2f39;color:#cfd6e0;font:900 22px Heebo;cursor:pointer}
.lv button[aria-pressed="true"]{background:linear-gradient(#5fe08f,#1a9a4e);color:#06200f;border-color:#8af6c3}.lv button:disabled{opacity:.5}
#go{flex:1;height:118px;border-radius:24px;border:3px solid #8af6c3;background:linear-gradient(#53dd88,#178a46);color:#062012;font:900 40px Heebo;cursor:pointer;box-shadow:inset 0 -6px 10px #0004;display:grid;place-content:center;line-height:1.05}
#go small{font:800 20px Heebo;opacity:.85}
#cash{width:280px;height:118px;border-radius:24px;border:3px solid #ffd970;background:linear-gradient(#ffe39a,#c79a2c);color:#3a2400;font:900 32px Heebo;cursor:pointer;display:grid;place-content:center;line-height:1.1}
#cash small{font:800 20px Heebo}#go:disabled,#cash:disabled{opacity:.4;cursor:default}#cash[hidden]{display:none}
#top{left:24px;top:20px;display:flex;gap:12px;align-items:center;direction:rtl}
.pill{background:rgba(14,16,22,.82);border:2px solid #3a3f4a;border-radius:99px;padding:8px 22px;font:800 26px Heebo;color:#f3f2e9;text-decoration:none;white-space:nowrap}
.pill b{color:#ffd970;font-family:Inter}
#msg{left:50%;top:150px;transform:translateX(-50%);background:rgba(14,16,22,.88);border:2px solid #ffd970;border-radius:22px;padding:14px 34px;font:900 36px Heebo;color:#ffe9a8;z-index:8;white-space:nowrap;pointer-events:none;transition:opacity .3s}
#msg.bad{border-color:#ff7b7b;color:#ffd0d0}#msg[hidden]{display:block;opacity:0}
#err{left:0;right:0;top:722px;text-align:center;color:#ffb0b0;font:800 26px Heebo;pointer-events:none;text-shadow:0 2px 4px #000}
#enter{position:fixed;inset:0;z-index:40;display:grid;place-items:center;background:#000c}#enter[hidden]{display:none}
#enter .card{position:relative;width:min(96vw,calc(92dvh * 1.777));aspect-ratio:1672/941;background:url(img/ck/entrance.webp) 0 0/100% 100%;border:3px solid #ffd970;border-radius:16px;overflow:hidden;box-shadow:0 0 60px #ffb04455}
#enter .txt{position:absolute;right:0;top:0;bottom:0;width:40%;padding:4% 4% 4% 2%;display:flex;flex-direction:column;justify-content:center;gap:1.4vh}
#enter h2{margin:0;font:900 clamp(22px,5vh,48px) Heebo;color:#ffd970;text-shadow:0 2px 0 #6b4a00}
#enter p{margin:0;font:600 clamp(11px,2.2vh,18px) Heebo;color:#f3e6c8;line-height:1.4}
#enter button{margin-top:1vh;height:clamp(36px,7vh,56px);border:0;border-radius:99px;background:linear-gradient(#53dd88,#178a46);color:#062012;font:900 clamp(15px,2.8vh,22px) Heebo;cursor:pointer}
#enter .back{background:none;border:1px solid #ffd970;color:#ffd970;height:auto;padding:4px;font-size:13px}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js?v=8"></script>
<script src="landscape.js?v=1"></script>
</head>
<body>
<div id="stage">
  <div id="marks"></div>
  <img class="abs" id="ido" src="img/ck/ido.webp" alt="עידו התרנגולת">
  <img class="abs" id="car" alt=""><div class="abs" id="who" hidden></div>
  <div class="abs" id="top"><a class="pill" href="./">→ ללובי</a><span class="pill">הארנק שלי <b id="bal">…</b></span><span class="top" id="topMount"></span></div>
  <div class="abs" id="msg" hidden></div>
  <div class="abs" id="err"></div>
  <div class="abs" id="bar">
    <div class="grp"><button class="sq" id="minus" aria-label="הימור קטן יותר">−</button><div id="betV">₪100<small>הימור</small></div><button class="sq" id="plus" aria-label="הימור גדול יותר">+</button></div>
    <div class="grp lv" id="lv"><span>🚦</span><button data-m="easy">קל</button><button data-m="normal" aria-pressed="true">רגיל</button><button data-m="hard">קשה</button><button data-m="extreme">אקסטרים</button></div>
    <button id="cash" hidden></button>
    <button id="go">▶ התחל</button>
  </div>
</div>
<div id="enter" hidden><div class="card"><div class="txt">
  <h2>🐔 עידו חוצה את הכביש</h2>
  <p>עידו התרנגולת צריך לעבור 10 נתיבים. כל קפיצה מוצלחת מעלה את הסכום.</p>
  <p>הראל במשאית, רועי באופנוע ואביחי באופניים כבר בדרך. רכב בנתיב, וההימור נעלם.</p>
  <p>אחרי כל צעד מחליטים: <b>להמשיך</b> או <b>לקחת את הכסף</b>. באקסטרים עד <b>×175</b>.</p>
  <button id="goIn">יאללה, לכביש 🐔</button><button class="back" onclick="location.href='./'">חזרה ללובי</button>
</div></div></div>
<script src="sfx.js?v=27"></script>
<script src="guide.js?v=41"></script>
<script>
"use strict";
// Golan Casino wiring: every step is drawn on the server (ck_start / ck_step / ck_cash); the page only animates the answer.
const db = supabase.createClient(GC_CONFIG.supabaseUrl, GC_CONFIG.supabaseKey);

const $ = (id) => document.getElementById(id);
const fmt = (n) => { n = Math.floor(Number(n) + 1e-6); const a = Math.abs(n); return a >= 1e9 ? "₪" + +(n / 1e9).toFixed(2) + "B" : a >= 1e6 ? "₪" + +(n / 1e6).toFixed(2) + "M" : "₪" + n.toLocaleString("en-US"); };
const T = { easy: [1.05, 1.10, 1.15, 1.22, 1.30, 1.40, 1.52, 1.67, 1.85, 2.10], normal: [1.15, 1.30, 1.50, 1.75, 2.05, 2.45, 2.95, 3.60, 4.45, 5.50],
  hard: [1.30, 1.70, 2.20, 2.90, 3.80, 5, 6.70, 9, 12, 16], extreme: [1.60, 2.60, 4.20, 7, 12, 20, 35, 60, 100, 175] };
const LANE = [420, 718, 1000, 1280, 1557], SIDE = 190, CARS = ["harel_truck", "roy_motorcycle", "avichai_bicycle"];
let balance = 0, bet = 100, mode = "normal", run = null, busy = false;
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const S = (k, a) => { try { SFX[k](a); } catch (e) {} };
function fit() { const vw = document.documentElement.clientWidth || innerWidth, vh = document.documentElement.clientHeight || innerHeight, s = Math.min(vw / 1672, vh / 941); $("stage").style.transform = `translate(-50%,-50%) scale(${s})`; }
addEventListener("resize", fit); addEventListener("orientationchange", () => setTimeout(fit, 300)); try { new ResizeObserver(fit).observe(document.documentElement); } catch (e) {} setInterval(fit, 1000); fit();   // phones report the new size late after rotating
const step = () => (run && run.status === "active" ? run.step : 0), active = () => run && run.status === "active";
const offset = () => Math.max(0, Math.min(5, step() - 2));
function idoX() { return step() === 0 ? SIDE : LANE[step() - 1 - offset()]; }
// markers: 5 lanes visible out of 10; each shows the total you'd collect there and the multiplier
function drawMarks() {
  const t = T[active() ? run.mode : mode], b = active() ? run.stake : bet, o = offset();
  $("marks").innerHTML = LANE.map((x, j) => { const i = o + j; return `<div class="abs mk${i + 1 === step() ? " cur" : i + 1 < step() ? " done" : ""}" style="left:${x}px"><b>${fmt(b * t[i])}</b><small>×${t[i].toFixed(2)}</small></div>`; }).join("");
  $("ido").style.left = idoX() + "px";
}
function controls() {
  const a = active(), t = T[a ? run.mode : mode], s = step();
  const ok = GC_LADDER(10, balance); if (!ok.includes(bet)) bet = ok.filter((v) => v <= bet).pop() || ok[0];
  $("betV").innerHTML = `${fmt(a ? run.stake : bet)}<small>הימור</small>`;
  $("minus").disabled = $("plus").disabled = a || busy;
  document.querySelectorAll("#lv button").forEach((b) => { b.setAttribute("aria-pressed", b.dataset.m === (a ? run.mode : mode)); b.disabled = a || busy; });
  $("go").disabled = busy;
  $("go").innerHTML = a ? `▶ צעד הבא<small>${fmt(run.stake * t[s])} · ×${t[s].toFixed(2)}</small>` : `▶ התחל<small>צעד ראשון ×${t[0].toFixed(2)}</small>`;
  $("cash").hidden = !(a && s >= 1); $("cash").disabled = busy;
  if (a && s >= 1) $("cash").innerHTML = `💰 קח ${fmt(run.stake * t[s - 1])}<small>רווח ${fmt(run.stake * t[s - 1] - run.stake)}+</small>`;
  drawMarks();
}
function say(t, bad, ms = 1800) { const m = $("msg"); m.textContent = t; m.classList.toggle("bad", !!bad); m.hidden = false; clearTimeout(say.t); say.t = setTimeout(() => (m.hidden = true), ms); }
function showBal(v) { if (v != null) { balance = +v; $("bal").textContent = fmt(v); } }
$("minus").onclick = () => { const ok = GC_LADDER(10, balance), i = ok.indexOf(bet); if (i > 0) { bet = ok[i - 1]; S("chip"); controls(); } };
$("plus").onclick = () => { const ok = GC_LADDER(10, balance), i = ok.indexOf(bet); if (i < ok.length - 1) { bet = ok[i + 1]; S("chip"); controls(); } };
$("lv").onclick = (e) => { const b = e.target.closest("button"); if (!b || active() || busy) return; mode = b.dataset.m; S("button"); controls(); };
const errText = (e) => { const m = (e && e.message) || ""; return m.includes("insufficient") ? "אין מספיק שקלים." : m.includes("invalid_amount") ? "הסכום מעל המקסימום שלך." : "משהו השתבש, נסה שוב."; };
// the animation of one answer from the server: a hop to the next lane, or a vehicle in that lane
async function animate(before, after) {
  const from = before ? before.step : 0, lost = after.status === "lost";
  const o = Math.max(0, Math.min(5, from - 2)), tx = LANE[Math.min(4, from - o)];
  const ido = $("ido"); ido.classList.remove("hop", "hit"); void ido.offsetWidth; ido.classList.add("hop"); ido.style.left = tx + "px"; S("whoosh");
  if (lost) {   // a friend's vehicle comes down that lane slowly enough to see who it is, stops on Ido, then drives off (decoration only)
    const car = $("car"), k = CARS[Math.floor(Math.random() * 3)], who = { harel_truck: "🚚 הראל", roy_motorcycle: "🏍️ רועי", avichai_bicycle: "🚲 אביחי" }[k];
    car.src = `img/ck/${k}.webp`; car.style.transition = "none"; car.style.left = tx + "px"; car.style.top = "-420px";
    const tag = $("who"); tag.textContent = who; tag.style.left = tx + "px"; tag.hidden = true;
    await sleep(420); ido.classList.remove("hop");
    void car.offsetWidth; car.style.transition = "top 1.6s cubic-bezier(.25,.6,.4,1)"; car.style.top = "-60px";   // rolls in, slowing down
    setTimeout(() => { tag.hidden = false; }, 500);
    await sleep(800); S("ckSquawk"); await sleep(700);   // Ido panics as the vehicle closes in…
    car.style.transition = "top .35s ease-in"; car.style.top = "250px"; await sleep(330);            // the bump
    ido.classList.add("hit"); S("ckImpact");   // …and the crash lands exactly on contact
    for (let i = 0; i < 9; i++) { const f = document.createElement("div"); f.className = "feather"; f.textContent = "🪶"; f.style.left = tx + "px"; f.style.top = "430px";
      f.style.setProperty("--dx", (Math.random() * 320 - 160) + "px"); f.style.setProperty("--dy", (Math.random() * -280) + "px"); $("stage").appendChild(f); setTimeout(() => f.remove(), 1200); }
    await sleep(1100);                                                                                   // a moment to see who did it
    car.style.transition = "top 1.5s ease-in"; car.style.top = "1100px"; setTimeout(() => (tag.hidden = true), 700); await sleep(1300);
  } else { await sleep(430); S("chip"); }
}
async function send(fn, args) { busy = true; controls(); $("err").textContent = "";
  const { data, error } = await db.rpc(fn, args); if (error) { $("err").textContent = errText(error); busy = false; controls(); return null; } return data; }
$("go").onclick = async () => {
  if (busy) return; S("button");
  const before = active() ? { ...run } : null;
  const data = before ? await send("ck_step", { p_run: run.id, p_from: run.step }) : await send("ck_start", { p_stake: bet, p_mode: mode, p_ref: crypto.randomUUID ? crypto.randomUUID() : Date.now() + "" + Math.random() });
  if (!data) return;
  if (!before) showBal(data.balance + (data.status === "won" ? -data.paid : 0));
  await animate(before, data); run = data;
  if (data.status === "lost") { say(`💥 עידו נפגע! הפסדת ${fmt(data.stake)}`, true, 2400); await sleep(1500); run = null; $("ido").classList.remove("hit"); }
  else if (data.status === "won") { showBal(data.balance); if (window.GC_BONUS) GC_BONUS("🐔 עידו חצה את כל הכביש!", data.paid, `×${T[data.mode][9]}`); run = null; }
  else say(`✅ צעד ${data.step} · ${fmt(data.stake * T[data.mode][data.step - 1])}`, false, 1200);
  showBal(data.balance); busy = false; controls();
};
$("cash").onclick = async () => {
  if (busy || !active() || run.step < 1) return;
  const data = await send("ck_cash", { p_run: run.id }); if (!data) return;
  S(data.paid >= data.stake * 5 ? "bigWin" : "win", false); say(`💰 לקחת ${fmt(data.paid)} · רווח ${fmt(data.paid - data.stake)}`, false, 2600);
  if (data.paid >= data.stake * 10 && window.GC_BONUS) GC_BONUS("🐔 עידו חצה ולקח!", data.paid, `×${T[data.mode][data.step - 1]}`);
  run = null; showBal(data.balance); busy = false; controls();
};
(async () => {
  controls();
  const { data: { session } } = await db.auth.getSession(); if (!session) { location.href = "./"; return; }
  const w = await db.from("wallets").select("balance").eq("user_id", session.user.id).single(); if (w.data) showBal(w.data.balance);
  const c = await db.rpc("ck_current"); if (c.data) { run = c.data; mode = run.mode; say(`חזרת לריצה: צעד ${run.step}`, false, 2000); }   // an unfinished run continues where it stopped
  controls(); if (window.GC_LOADER) GC_LOADER.done();
  if (!run) { $("enter").hidden = false; await new Promise((ok) => $("goIn").onclick = () => { $("enter").hidden = true; S("button"); ok(); }); }
  GC_GUIDE.init({ game: "chicken", db, mount: $("topMount"), steps: GC_STEPS.chicken() });
})();
</script>
<script src="chat.js?v=15"></script>
</body>
