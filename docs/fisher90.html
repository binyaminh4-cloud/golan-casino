<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<script src="loader.js?v=13"></script>
<title>פישר בדקה ה־90 · גולן קזינו</title>
<link rel="icon" href="img/brand/favicon.png?v=2">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;700;900&family=Inter:wght@700;800&display=swap">
<style>
:root{--line:#2c455a;--blue:#1d6fd1;--gold:#C5A05A}
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden}
body{position:fixed;inset:0;background:radial-gradient(ellipse at 30% 20%,#13314d,#08111d 70%);color:#edf4ff;font:15px Heebo,Arial,sans-serif;display:grid;grid-template-rows:auto minmax(0,1fr);}
.top{display:flex;align-items:center;gap:10px;padding:5px max(10px,env(safe-area-inset-right)) 5px max(56px,calc(52px + env(safe-area-inset-left)));background:#06101bcc;border-bottom:1px solid var(--line)}
.top a{color:#F1D69A;text-decoration:none;font-weight:700;border:1px solid #80602E;border-radius:99px;padding:4px 12px;white-space:nowrap}
.top h1{margin:0;font:900 18px Heebo;white-space:nowrap}.top h1 span{color:#8cc4ff}
.score{margin-inline-start:auto;display:flex;gap:12px;align-items:center;padding:3px 14px;background:#0c1b30;border:1px solid var(--line);border-radius:10px;direction:ltr;font:800 16px Inter}.score span{color:#8cc4ff}
#sound{background:#0c1b30;border:1px solid var(--line);color:#cfe2ff;border-radius:99px;padding:4px 12px;font:700 12px Heebo}
.play{position:relative;display:grid;grid-template-columns:1fr;gap:0;padding:8px max(10px,env(safe-area-inset-right)) max(8px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left));min-height:0}
.field{position:relative;align-self:center;justify-self:center;width:100%;height:100%;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#183b2c}
.field canvas{width:100%;height:100%;display:block;object-fit:cover}
.stage{position:absolute;top:10px;right:10px;background:#0c1b30d9;padding:6px 12px;border-radius:9px;display:grid;gap:2px}.stage span{font-size:11px;color:#a8c1dd}.stage b{font-size:16px}
.progress{position:absolute;bottom:10px;right:14px;display:flex;gap:6px}.progress i{display:block;width:24px;height:5px;border-radius:4px;background:#ffffff40}.progress i.done{background:#9bdbb6}.progress i.current{background:#62b3ff}
#loading{position:absolute;inset:0;display:grid;place-content:center;background:#0b1421e8}
#result{position:absolute;left:50%;top:45%;transform:translate(-50%,-50%);padding:14px 30px;text-align:center;background:#102337f0;border:2px solid #748ba0;border-radius:16px;box-shadow:0 12px 60px #0009;display:grid;gap:4px}
#result b{font:900 26px Heebo}#result.win{border-color:#9bdbb6}#result.win b{color:#9bdbb6}#result.loss b{color:#ff8a8a}
.panel{position:absolute;inset:auto 0 max(8px,env(safe-area-inset-bottom)) 0;margin:auto;width:min(560px,94%);display:grid;grid-template-columns:1fr 1fr;gap:8px;z-index:3}
.panel>*{grid-column:span 2}.panel #actions{grid-column:span 2;grid-template-columns:1fr 1fr}
.bank{position:fixed;top:52px;left:max(10px,env(safe-area-inset-left));z-index:4;grid-column:auto!important;width:auto}
#message{display:none}
.flash{position:absolute;left:50%;top:22%;transform:translateX(-50%);z-index:5;padding:10px 24px;border-radius:99px;font:900 22px Heebo;white-space:nowrap;animation:fl .3s ease-out}
.flash.ok{background:#0f3d27f0;border:2px solid #9bdbb6;color:#c9f5d8}.flash.bad{background:#3d0f12f0;border:2px solid #ff8a8a;color:#ffd0d0}
@keyframes fl{from{transform:translateX(-50%) scale(.6);opacity:0}}
.card{background:#0c1b30e6;border:1px solid var(--line);border-radius:12px;padding:8px 12px}
.bank{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;align-items:baseline}.bank small{color:#a9b9cc;font-size:12px}.bank b{font:800 17px Inter;direction:ltr;text-align:left}
#pot{font:900 24px Inter;color:#ffe27a;direction:ltr;text-align:left}
#start-panel{display:grid;gap:8px;justify-items:center}#start-panel label{font-size:13px;color:#a9b9cc}
#start{width:100%;height:46px;border:0;border-radius:99px;background:linear-gradient(180deg,#5fb0ff,#1d6fd1);color:#fff;font:900 18px Heebo;cursor:pointer}#start:disabled{opacity:.5}
#start-panel small{color:#a9b9cc;font-size:11px;text-align:center}
#actions{display:grid;gap:8px}
#actions button{display:grid;gap:1px;text-align:right;padding:8px 12px;border-radius:12px;border:1px solid #3d7fcf;background:linear-gradient(180deg,#1f63b5,#174c8c);color:#fff;cursor:pointer}
#actions button:active{transform:scale(.98)}
#actions .name{font:900 17px Heebo}#actions .amount{font:800 15px Heebo;color:#ffe27a}#actions .profit{font-size:12px;color:#bfe3c9}#actions .odds{font-size:11px;color:#cfe2ff;opacity:.85}
.cash{height:46px;border-radius:12px;border:2px solid #9bdbb6;background:#14352a;color:#c9f5d8;font:900 16px Heebo;cursor:pointer;display:grid;place-items:center;line-height:1.1}.cash small{font:600 11px Heebo;color:#9bdbb6}
#message{margin:0;font-size:12px;color:#a9b9cc;text-align:center}
#review{display:none}
[hidden]{display:none!important}
@media (max-height:420px){.card{padding:6px 10px}#actions .odds{display:none}#actions button{padding:6px 10px}#start,.cash{height:40px}.score{display:none}}

/* top bar floats over the game; the game uses the full height */
.top{position:fixed!important;top:0;left:0;right:0;z-index:5!important;pointer-events:none;background:linear-gradient(180deg,#0009,#0000)!important;border:0!important;padding:3px max(8px,env(safe-area-inset-right)) 12px max(56px,calc(52px + env(safe-area-inset-left)))!important;justify-content:space-between}
.top>*{pointer-events:auto}.top a{padding:2px 9px!important;font-size:12px}.top h1,.top .score{display:none!important}
.top .bal{position:absolute;left:max(100px,calc(94px + env(safe-area-inset-left)));top:3px;display:grid;line-height:1.1;font-size:10px;text-align:center}.top .bal b{font-size:13px!important}
body{grid-template-rows:minmax(0,1fr)!important}.play{grid-row:1;padding-top:4px!important}.bank{top:30px!important;left:max(54px,calc(50px + env(safe-area-inset-left)))!important}.stage{top:30px!important}

/* move cards: a row of half-transparent cards in the corner, the pitch stays visible behind them */
.panel.playing{inset:auto max(12px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) auto;width:auto;display:flex;flex-direction:row;gap:8px;align-items:stretch;margin:0}
.panel.playing #actions{display:flex!important;flex-direction:row;gap:8px}
#actions button,.cash{display:flex!important;flex-direction:row;align-items:center;gap:10px;text-align:right;padding:8px 14px 8px 12px;border-radius:16px;
  background:rgba(10,24,44,.55)!important;border:1.5px solid rgba(120,180,255,.75)!important;color:#fff;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);box-shadow:0 6px 20px #0006;height:auto;min-width:0;cursor:pointer;font-family:Heebo}
.panel.playing .cash{order:-1}.cash{border-color:rgba(155,219,182,.85)!important;background:rgba(14,48,34,.55)!important}
#actions button:hover,.cash:hover{background:rgba(20,44,76,.75)!important}#actions button:active,.cash:active{transform:scale(.97)}
.ic{font-style:normal;flex:none;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-size:22px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25)}
.txt{display:grid;gap:1px}.txt .name{font:900 17px Heebo;white-space:nowrap}.txt .name em{font-style:normal;color:#8cc4ff;margin-inline-start:4px}
.txt .amount{font:800 15px Heebo;color:#9bdbb6;white-space:nowrap}.txt .profit{font:600 11px Heebo;color:#cfe2ff;opacity:.85;white-space:nowrap}
.cash .txt .amount{color:#c9f5d8}
@media (max-height:420px){.ic{width:32px;height:32px;font-size:17px}#actions button,.cash{padding:5px 10px}.txt .name{font-size:14px}.txt .amount{font-size:13px}}

/* overlay top bar: lobby (right) · Ido (next to it) · sound + wallet (left); nothing overlaps */
.top .gd-btn{position:absolute;right:max(84px,calc(78px + env(safe-area-inset-right)));top:3px;padding:2px 9px 2px 3px;font-size:11px;gap:4px}
.top .gd-btn img,.top .gd-btn .q{width:20px;height:20px}
.top .sfx-btn{position:absolute;left:max(56px,calc(52px + env(safe-area-inset-left)));top:3px;width:32px;height:32px;font-size:15px}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js?v=8"></script>
<script src="landscape.js?v=1"></script>
</head>
<body>
<header class="top"><a href="./">→ ללובי</a><h1>פישר <span>בדקה ה־90</span></h1>
  <div class="score"><b>1 : 1</b><span>90:00</span></div><button id="sound" aria-pressed="false" style="display:none">סאונד כבוי</button></header>
<main class="play">
  <section class="field" aria-label="מגרש המשחק"><canvas id="pitch" width="1440" height="810"></canvas>
    <div class="stage"><span id="stage-count">התקפה אחרונה</span><b id="stage-title">הכדור אצל פישר</b></div>
    <div id="loading">טוען את המגרש…</div><div id="result" hidden></div><div class="progress" id="progress"></div></section>
  <aside class="panel">
    <div class="card bank"><small>הארנק שלי</small><b id="balance">…</b><small id="pot-label">סכום כניסה</small><strong id="pot">₪100</strong></div>
    <div class="card" id="start-panel"><label>סכום ההתקפה</label><span id="stepper"></span><input id="stake" type="hidden" value="100">
      <button id="start" disabled>⚽ התחל התקפה</button><small>חמש החלטות. כל מהלך שמצליח מגדיל את הקופה, מהלך שנכשל מאבד אותה. אחרי הצלחה אפשר לקחת ולצאת.</small></div>
    <div id="actions" hidden></div>
    <button id="cash" class="cash" hidden></button>
    <p id="message" role="status" aria-live="polite">בחר סכום וצא להתקפה.</p>
  </aside>
</main>
<div id="review"></div>
<script src="sfx.js?v=21"></script>
<script src="guide.js?v=38"></script>
<script src="vendor/f90_engine.js?v=1"></script>
<script src="f90.js?v=5"></script>
<script>
// bet in fixed jumps; the intro explains the game once per visit (skippable)
GC_STEPPER(document.getElementById("stepper"), document.getElementById("stake"), { start: 100 });
setTimeout(() => GC_GUIDE.init({ game: "fisher90", db, mount: document.querySelector(".top"), steps: GC_STEPS.fisher90() }), 900);
</script>
<script src="chat.js?v=14"></script>
</body>
</html>
