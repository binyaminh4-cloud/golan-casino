<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<script src="loader.js?v=14"></script>
<title>פרסומות החבר׳ה · גולן קזינו</title>
<link rel="icon" href="img/brand/favicon.png?v=2">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;700;900&display=swap">
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#0b0806;color:#f4e7c8;font-family:Heebo,sans-serif}
body{display:flex;flex-direction:column;min-height:100dvh}
.top{display:flex;align-items:center;gap:12px;padding:10px 14px;padding-top:max(10px,env(safe-area-inset-top));border-bottom:1px solid #3a2a14;background:linear-gradient(#1a120a,#0b0806)}
.top a{color:#e8c46a;text-decoration:none;font-weight:700}.top h1{margin:0;font-size:19px;font-weight:900;flex:1}
.left{font-size:13px;color:#cdb98a;background:#1d150c;border:1px solid #4a3518;border-radius:20px;padding:4px 10px;white-space:nowrap}
main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:14px}
.screen{position:relative;width:min(100%,420px);aspect-ratio:9/16;max-height:72dvh;background:#000;border:2px solid #b8913f;border-radius:16px;overflow:hidden;box-shadow:0 0 30px rgba(232,196,106,.18)}
video{width:100%;height:100%;object-fit:contain;display:block;background:#000}
.bar{position:absolute;left:0;right:0;bottom:0;height:6px;background:rgba(255,255,255,.12)}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#f6d77a,#c9952f)}
.badge{position:absolute;top:10px;right:10px;background:rgba(0,0,0,.65);border:1px solid #b8913f;border-radius:12px;padding:4px 10px;font-weight:900;color:#f6d77a;font-size:14px}
.cover{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:20px;background:rgba(8,6,4,.82)}
.cover[hidden]{display:none}.cover b{font-size:22px}.cover small{color:#cdb98a;font-size:14px;line-height:1.5}
button.go{font:inherit;font-weight:900;font-size:19px;color:#1a1208;background:linear-gradient(#f6d77a,#c9952f);border:0;border-radius:14px;padding:14px 26px;cursor:pointer}
button.go:disabled{opacity:.5}
#msg{min-height:22px;text-align:center;color:#cdb98a;font-size:15px}
.win{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.6);z-index:9}
.win[hidden]{display:none}.win div{background:#1a120a;border:2px solid #e8c46a;border-radius:18px;padding:22px 26px;text-align:center}
.win .home{display:block;margin-top:14px;color:#e8c46a;font-weight:700;text-decoration:none;font-size:17px;padding:8px}.win b{display:block;font-size:30px;color:#f6d77a;margin:6px 0 14px}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js?v=8"></script>
</head>
<body>
<header class="top"><a href="./">→ ללובי</a><h1>🎬 פרסומות החבר׳ה</h1><span class="left" id="left">…</span></header>
<main>
  <div class="screen">
    <video id="v" playsinline preload="none" disablepictureinpicture controlslist="nodownload noplaybackrate"></video>
    <span class="badge" id="pay" hidden></span>
    <div class="bar"><i id="prog"></i></div>
    <div class="cover" id="cover"><b>צופים עד הסוף, מקבלים לבנק</b><small>הסרטון נבחר בהגרלה. עד 10 צפיות ביום.<br>סוגרים באמצע? לא מקבלים.</small><button class="go" id="go" disabled>▶ הגרל סרטון</button></div>
  </div>
  <p id="msg" role="status" aria-live="polite"></p>
</main>
<div class="win" id="win" hidden><div>נכנס לבנק<b id="winAmt"></b><button class="go" id="again">▶ עוד סרטון</button><a class="home" href="./">→ חזרה ללובי</a></div></div>
<script>
'use strict';
const $ = (id) => document.getElementById(id), db = supabase.createClient(GC_CONFIG.supabaseUrl, GC_CONFIG.supabaseKey);
const fmt = (n) => { n = +n; return n >= 1e9 ? "₪" + +(n / 1e9).toFixed(2) + "B" : n >= 1e6 ? "₪" + +(n / 1e6).toFixed(2) + "M" : "₪" + n.toLocaleString("en-US"); };
const v = $("v"); let cur = null, maxT = 0, busy = false;
const setLeft = (n) => { $("left").textContent = `נשארו היום: ${n}/10`; $("go").disabled = n <= 0; if (n <= 0) $("msg").textContent = "סיימת את 10 הצפיות של היום. מחר עוד 🙂"; };
async function init() {
  const { data: { session } } = await db.auth.getSession(); if (!session) { location.href = "./"; return; }
  const { data, error } = await db.rpc("ad_status"); if (error) { $("msg").textContent = "שגיאה בטעינה, נסה שוב"; return; }
  setLeft(data.left);
}
async function start() {
  if (busy) return; busy = true; $("go").disabled = true; $("win").hidden = true; $("msg").textContent = "מגריל סרטון…";
  const { data, error } = await db.rpc("ad_start"); busy = false;
  if (error || !data.ok) { $("msg").textContent = data?.reason === "daily_limit" ? "" : "אין כרגע סרטון, נסה שוב"; setLeft(data?.left ?? 0); $("cover").hidden = false; return; }
  cur = data; maxT = 0; $("pay").textContent = "🎁 " + fmt(data.payout); $("pay").hidden = false; $("prog").style.width = "0";
  v.src = data.file + "?v=1"; $("cover").hidden = true; $("msg").textContent = "צופים עד הסוף…";
  try { await v.play(); } catch (e) { $("cover").hidden = false; $("go").disabled = false; $("go").textContent = "▶ נגן"; $("go").onclick = () => { $("go").onclick = start; $("go").textContent = "▶ הגרל סרטון"; $("cover").hidden = true; v.play(); }; }
}
// no skipping ahead: jumping forward goes back to the furthest point already watched
v.addEventListener("timeupdate", () => { if (v.currentTime > maxT + 1.5) v.currentTime = maxT; else maxT = Math.max(maxT, v.currentTime); if (v.duration) $("prog").style.width = (100 * v.currentTime / v.duration) + "%"; });
v.addEventListener("ended", async () => {
  if (!cur) return; const view = cur.view; cur = null; $("msg").textContent = "בודק…";
  const { data, error } = await db.rpc("ad_finish", { p_view: view });
  if (!error && data.ok) { $("winAmt").textContent = fmt(data.paid); $("win").hidden = false; $("msg").textContent = ""; setLeft(data.left); $("again").disabled = data.left <= 0; }
  else { $("msg").textContent = data?.reason === "too_early" ? "הסרטון לא נצפה עד הסוף, לא שולם." : "לא שולם, נסה סרטון אחר."; $("cover").hidden = false; if (data?.left !== undefined) setLeft(data.left); else $("go").disabled = false; }
});
document.addEventListener("visibilitychange", () => { if (document.hidden && !v.paused) v.pause(); else if (!document.hidden && cur && v.paused) v.play().catch(() => {}); });
$("go").onclick = start; $("again").onclick = start;
$("win").addEventListener("click", (e) => { if (e.target.id === "win") { $("win").hidden = true; $("cover").hidden = false; } });
init();
</script>
<script src="chat.js?v=1793909544"></script>
<script src="voice.js?v=1793911936"></script>
</body>
</html>
