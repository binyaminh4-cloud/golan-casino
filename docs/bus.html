<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<script src="loader.js?v=13"></script>
<title>נהג מיניבוס · גולן קזינו</title>
<link rel="icon" href="img/brand/favicon.png?v=2">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@500;700;800&family=Inter:wght@700;800&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js?v=8"></script>
<script src="portrait.js?v=1"></script>
<style>
  html,body{margin:0;height:100%;background:#2b2a26;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  [hidden]{display:none!important}
  canvas{position:fixed;inset:0;width:100vw;height:100dvh;display:block}
  .hud{position:fixed;top:0;left:0;right:0;z-index:5;display:flex;align-items:center;gap:8px;padding:max(8px,env(safe-area-inset-top)) 10px 8px;
    background:linear-gradient(rgba(10,7,5,.85),rgba(10,7,5,0));color:#F5ECDD;font:700 14px Heebo,sans-serif;direction:rtl}
  .hud a{color:#F1D69A;text-decoration:none;border:1px solid rgba(241,214,154,.5);border-radius:99px;padding:4px 10px;font-size:13px}
  .hud .pill{background:rgba(0,0,0,.45);border-radius:99px;padding:4px 10px}
  .hud b{font:800 15px Inter;color:#ffe27a;direction:ltr;unicode-bidi:isolate}
  .hud .sp{margin-inline-start:auto}
  .hint{position:fixed;bottom:max(14px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);z-index:5;background:rgba(10,7,5,.75);color:#F5ECDD;
    font:700 15px Heebo;padding:8px 16px;border-radius:99px;border:1px solid rgba(241,214,154,.4);white-space:nowrap;pointer-events:none;transition:opacity .4s}
  .bub{position:fixed;z-index:6;max-width:62vw;background:#fff;color:#141414;border:2px solid #141414;border-radius:14px;padding:6px 10px;font:700 14px Heebo;direction:rtl;
    box-shadow:0 6px 16px rgba(0,0,0,.4);animation:bp .25s cubic-bezier(.2,1.6,.4,1);pointer-events:none}
  .bub small{display:block;font-size:11px;color:#80602E}
  @keyframes bp{from{transform:scale(.4);opacity:0}}
  .flash{position:fixed;inset:0;z-index:4;background:rgba(229,72,77,.35);pointer-events:none;animation:fl .5s ease-out forwards}@keyframes fl{to{opacity:0}}
  .start,.sum{position:fixed;inset:0;z-index:10;display:grid;place-items:center;background:rgba(8,6,4,.78);direction:rtl}
  .card{width:min(420px,90vw);background:radial-gradient(ellipse at 50% 0%,#3a2a10,#120c08);border:2px solid #F1D69A;border-radius:18px;padding:18px;text-align:center;color:#F5ECDD;font:500 15px/1.5 Heebo}
  .card h2{margin:0 0 6px;font:800 24px Heebo;color:#F1D69A}
  .card .row{display:flex;justify-content:space-between;padding:4px 2px;border-bottom:1px solid rgba(255,255,255,.08)}
  .card .row b{font:800 15px Inter;direction:ltr}
  .card .tot{font:800 30px Inter;color:#ffe27a;margin:10px 0;direction:ltr}
  .card button,.card a.btn{display:block;width:100%;margin-top:10px;padding:12px;border:0;border-radius:12px;font:800 17px Heebo;cursor:pointer;text-decoration:none;box-sizing:border-box}
  .card .go{background:linear-gradient(#F1D69A,#C5A05A);color:#1b0f06}.card .ghost{background:transparent;color:#F1D69A;border:1px solid rgba(241,214,154,.5)}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div class="hud"><a href="jobs.html">→ עבודות</a><span class="pill">🚐 תחנה <b id="hStop">0/8</b></span><span class="pill sp">הרווחת <b id="hEarn">₪0</b></span></div>
<div class="hint" id="hint">החזק את האצבע על המסך כדי לבלום</div>
<div class="start" id="startBox"><div class="card"><h2>🚐 נהג מיניבוס</h2>
  <p>המיניבוס נוסע לבד. <b>החזק את האצבע</b> כדי לבלום ו<b>עצור בתוך המשבצת הצהובה</b> — החברים עולים ומשלמים. עצירה בדיוק באמצע = בונוס.</p>
  <p>פרות, כבשים וטרקטורים על הכביש: לבלום בזמן! כל פגיעה מורידה מהטיפים.</p>
  <button class="go" id="goBtn">יאללה, לנסוע</button><a class="btn ghost" href="jobs.html">חזרה לעבודות</a></div></div>
<div class="sum" id="sumBox" hidden></div>
<script src="sfx.js?v=27"></script>
<script src="bus.js?v=1"></script>
</body>
</html>
